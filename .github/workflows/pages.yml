# Deploy pulsar to GitHub Pages on every push to main.
#
# Pages cannot set response headers, so the deployed app has no COOP/COEP and
# runs on the postMessage transport — the designed, tested fallback
# (tests/unit/writeRing.test.ts proves the two paths render bit-identical
# audio; the in-app note names the slower path honestly). The sab LED will sit
# unlit on the deployed site, and that is the truth.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm exec vite build --base="/${{ github.event.repository.name }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
